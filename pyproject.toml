[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "q-shield"
version = "0.1.0"
description = "Quantum Digital Signature Security Framework"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=2.5.2",
    "qiskit-aer>=0.17.2",
    "numpy>=2.5.2",
    "scipy>=1.18.1",
    "pandas>=3.0.5",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = [
    "error",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
extraPaths = [".", "src"]
